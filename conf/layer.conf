# The NervesHub layer.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "nerveshub"
BBFILE_PATTERN_nerveshub = "^${LAYERDIR}/"
BBFILE_PRIORITY_nerveshub = "6"

# Just core.
#
# This used to also require "rauc", so that a missing meta-rauc failed at
# layer-add time with a clear message rather than at build time with "Nothing
# RPROVIDES". That was right when RAUC was the only update tool, and wrong once
# the recipe grew a PACKAGECONFIG: it made the layer impossible to use for an
# fwup-only image, which needs no RAUC at all and should not have to carry the
# layer to say so.
#
# The clear message is kept, and moved to where it can tell which tool was
# actually asked for -- see the recipe's anonymous python.
LAYERDEPENDS_nerveshub = "core"
# No released Yocto ships a Rust new enough to build this yet -- scarthgap has
# cargo 1.75 and walnascar 1.84, against an agent that needs 1.88. The compat
# list is deliberately optimistic rather than empty: the recipe itself is
# correct on scarthgap (it parses, fetches and reaches do_compile), and only
# the toolchain stops it. See README.md for the options.
LAYERSERIES_COMPAT_nerveshub = "scarthgap styhead walnascar whinlatter"
